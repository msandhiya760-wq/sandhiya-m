<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy – AI Workout Generator</title>
    <!-- Google Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.75), rgba(30, 41, 59, 0.85)),
                        url('/static/images/gym-bg.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            padding: 36px 32px;
            animation: fadeIn 0.5s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header p {
            color: #64748b;
            font-size: 0.92rem;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            font-size: 0.95rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            color: #0f172a;
            transition: all 0.2s ease-in-out;
            outline: none;
        }

        .form-control:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        select.form-control {
            cursor: pointer;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.45);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .footer-nav {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.85rem;
        }

        .footer-nav a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .footer-nav a:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Popup Modal for API Key Alert */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .modal-box {
            background: #ffffff;
            width: 90%;
            max-width: 440px;
            border-radius: 14px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
        }

        .modal-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            line-height: 1;
        }

        .modal-box h3 {
            font-size: 1.35rem;
            color: #dc2626;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .modal-box p {
            font-size: 0.92rem;
            color: #475569;
            line-height: 1.55;
            margin-bottom: 20px;
        }

        .modal-box code {
            background: #f1f5f9;
            color: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.88rem;
        }

        .btn-modal {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 11px 24px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-modal:hover {
            background: #1d4ed8;
        }

        @media (max-width: 480px) {
            .container {
                padding: 26px 20px;
            }
            .grid-2 {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🏋️ FitBuddy - AI Workout Generator</h1>
            <p>Personalized 7-day fitness plans tailored by Google Gemini AI</p>
        </div>

        <form action="/generate-workout" method="POST" id="workoutForm" onsubmit="return handleWorkoutSubmit(event)">
            <div class="form-group">
                <label for="username">Name:</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="e.g., Alex Johnson" required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label for="user_id">User ID:</label>
                    <input type="number" id="user_id" name="user_id" class="form-control" placeholder="e.g., 10" min="1" required>
                </div>
                <div class="form-group">
                    <label for="age">Age:</label>
                    <input type="number" id="age" name="age" class="form-control" placeholder="e.g., 24" min="10" max="100" required>
                </div>
            </div>

            <div class="form-group">
                <label for="weight">Weight (kg):</label>
                <input type="number" step="0.1" id="weight" name="weight" class="form-control" placeholder="e.g., 70.0" min="20" max="300" required>
            </div>

            <div class="form-group">
                <label for="goal">Fitness Goal:</label>
                <input type="text" id="goal" name="goal" list="goal-suggestions" class="form-control" placeholder="e.g., weight loss, muscle gain, flexibility" required>
                <datalist id="goal-suggestions">
                    <option value="Muscle gain">
                    <option value="Weight loss">
                    <option value="General wellness & endurance">
                    <option value="Core strength and flexibility">
                    <option value="High intensity fat burn">
                </datalist>
            </div>

            <div class="form-group">
                <label for="intensity">Workout Intensity:</label>
                <select id="intensity" name="intensity" class="form-control" required>
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="spinner" id="spinner"></span>
                <span id="btnText">Generate Plan</span>
            </button>
        </form>

        <div class="footer-nav">
            <a href="/view-all-users">👥 Admin Dashboard</a>
        </div>
    </div>

    <!-- API Key Popup Modal -->
    <div id="apiKeyModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon">⚠️</div>
            <h3>API Key Not Found</h3>
            <p>Google Gemini API Key is missing.<br>Please set your <code>GOOGLE_API_KEY</code> in the <code>.env</code> file before generating a workout plan.</p>
            <button type="button" class="btn-modal" onclick="closeApiKeyModal()">OK, Got It</button>
        </div>
    </div>

    <script>
        const initialHasApiKey = {{ 'true' if has_api_key else 'false' }};

        function showApiKeyPopup() {
            const modal = document.getElementById('apiKeyModal');
            if (modal) {
                modal.style.display = 'flex';
            } else {
                alert("⚠️ API Key Not Found!\n\nPlease set your GOOGLE_API_KEY in the .env file before generating a workout plan.");
            }
        }

        function closeApiKeyModal() {
            const modal = document.getElementById('apiKeyModal');
            if (modal) {
                modal.style.display = 'none';
            }
        }

        async function handleWorkoutSubmit(event) {
            // First check dynamically if API key is configured
            try {
                const response = await fetch('/api/check-api-key');
                const result = await response.json();
                if (!result.configured) {
                    event.preventDefault();
                    showApiKeyPopup();
                    return false;
                }
            } catch (err) {
                if (!initialHasApiKey) {
                    event.preventDefault();
                    showApiKeyPopup();
                    return false;
                }
            }

            // If key is present, show spinner and proceed
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btnText');
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Generating with Gemini AI...';
            btn.style.opacity = '0.85';
            btn.style.pointerEvents = 'none';
            return true;
        }
    </script>
</body>
</html>
